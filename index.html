<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reaction Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Shared gradients for the shape test -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="g-sphere" cx="35%" cy="35%" r="70%">
        <stop offset="0" stop-color="#d4e0ff"/>
        <stop offset=".5" stop-color="#5b7fe0"/>
        <stop offset="1" stop-color="#1e3473"/>
      </radialGradient>
      <linearGradient id="g-side" x1="0" x2="1">
        <stop offset="0" stop-color="#2f4fa8"/>
        <stop offset=".35" stop-color="#8eabf6"/>
        <stop offset="1" stop-color="#253f8a"/>
      </linearGradient>
    </defs>
  </svg>

  <main>
    <section id="home">
      <h1>Reaction Lab</h1>
      <p class="muted">Two quick tests. Hit the box (or press <kbd>Space</kbd>) <b>only</b> when the goal shows up. Ignore everything else.</p>

      <label class="name">Your name
        <input id="name" type="text" maxlength="30" placeholder="e.g. Alex" autocomplete="off">
      </label>

      <div class="cards">
        <button class="card" data-test="colour">
          <span class="card-icon colours"><i></i><i></i><i></i><i></i></span>
          <b>Colour test</b>
          <span class="muted">Click only when the box turns your goal colour.</span>
        </button>
        <button class="card" data-test="shape">
          <span class="card-icon" id="shape-icon"></span>
          <b>Shape test</b>
          <span class="muted">Click only when your goal shape appears.</span>
        </button>
      </div>

      <div id="downloads"></div>
    </section>

    <section id="test" hidden>
      <div class="bar">
        <button id="quit" class="ghost" aria-label="Quit test">✕</button>
        <div class="goal">Goal: <span id="goal"></span></div>
        <div id="progress" class="muted">0 / 10</div>
      </div>
      <div id="stage">
        <div id="stim"></div>
        <div id="msg"></div>
      </div>
    </section>

    <section id="results" hidden>
      <h2 id="results-title"></h2>
      <div id="stats" class="stats"></div>
      <div class="actions">
        <button id="csv" class="primary">Download CSV</button>
        <button id="again">Try again</button>
        <button id="home-btn" class="ghost">Home</button>
      </div>
      <table>
        <thead><tr><th>#</th><th>Attempt</th><th>Shown</th><th>Result</th><th>Time (ms)</th></tr></thead>
        <tbody id="log"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
