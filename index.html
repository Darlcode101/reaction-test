<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reaction Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Shading overlays drawn on top of each shape's flat colour -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="g-sphere" cx="35%" cy="35%" r="70%">
        <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
        <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".5"/>
      </radialGradient>
      <linearGradient id="g-side" x1="0" x2="1">
        <stop offset="0" stop-color="#000" stop-opacity=".35"/>
        <stop offset=".35" stop-color="#fff" stop-opacity=".3"/>
        <stop offset="1" stop-color="#000" stop-opacity=".4"/>
      </linearGradient>
    </defs>
  </svg>

  <main>
    <section id="home">
      <h1>Reaction Lab</h1>
      <p class="muted">Three quick tests. Hit the box (or press <kbd>Space</kbd>) <b>only</b> when the goal shows up. Ignore everything else.</p>

      <div class="cards">
        <button class="card" data-test="shape">
          <span class="card-icon" id="shape-icon"></span>
          <b>1. Shape test</b>
          <span class="muted">Click only when your goal shape appears.</span>
        </button>
        <button class="card" data-test="combo">
          <span class="card-icon" id="combo-icon"></span>
          <b>2. Shape + colour test</b>
          <span class="muted">Click only when the shape <i>and</i> the colour both match.</span>
        </button>
        <button class="card" data-test="focus">
          <span class="card-icon"><span class="dot big"></span></span>
          <b>3. Focus test</b>
          <span class="muted">Stare at the dot. Click the moment it turns green.</span>
        </button>
      </div>

      <div id="downloads"></div>
    </section>

    <section id="test" hidden>
      <div class="bar">
        <button id="quit" class="ghost" aria-label="Quit test">✕</button>
        <div class="goal">Goal: <span id="goal"></span></div>
        <div id="progress" class="muted">0 / 10</div>
      </div>
      <div id="stage">
        <div id="stim"></div>
        <div id="msg"></div>
      </div>
    </section>

    <section id="results" hidden>
      <h2 id="results-title"></h2>
      <div id="stats" class="stats"></div>
      <div class="actions">
        <button id="csv" class="primary">Download CSV</button>
        <button id="again">Try again</button>
        <button id="home-btn" class="ghost">Home</button>
      </div>
      <table>
        <thead><tr><th>#</th><th>Attempt</th><th>Shown</th><th>Result</th><th>Time (ms)</th></tr></thead>
        <tbody id="log"></tbody>
      </table>
    </section>
  </main>

  <div id="scare" hidden></div>

  <script src="app.js"></script>
</body>
</html>
